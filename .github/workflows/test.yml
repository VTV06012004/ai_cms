name: Go tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: Issue3TestPwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pIssue3TestPwd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_DSN: root:Issue3TestPwd@tcp(127.0.0.1:3306)/mysql?parseTime=true&loc=Local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - run: go test -count=1 ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
