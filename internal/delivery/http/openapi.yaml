openapi: 3.0.3
info:
  title: AI CMS API
  version: 1.0.0
  description: |
    API của hệ thống CMS (Go + Gin + MySQL).

    **Xác thực:** đăng nhập ở `POST /api/auth/login`, lấy `token`, bấm nút **Authorize** ở góc trên rồi dán token (không cần gõ chữ `Bearer`).

    **Phân quyền:** `author` chỉ quản lý bài của mình; `editor` quản lý mọi bài, danh mục, thẻ, ảnh; `admin` có thêm quản lý menu, người dùng và nhật ký hệ thống.

    **Phân trang:** các danh sách có `?page=` (mặc định 1) và `?per_page=` (mặc định 20, tối đa 100).

    **Lỗi:** mọi lỗi trả về dạng `{"error": "thông báo"}` kèm mã HTTP phù hợp.
servers:
  - url: /
tags:
  - name: Hệ thống
  - name: Xác thực
  - name: Bài viết
  - name: Phiên bản
  - name: Danh mục
  - name: Thẻ
  - name: Menu
  - name: Thư viện ảnh
  - name: Quản trị

paths:
  /health:
    get:
      tags: [Hệ thống]
      summary: Kiểm tra API còn sống
      responses:
        '200':
          description: API hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string }

  /api/auth/register:
    post:
      tags: [Xác thực]
      summary: Đăng ký tài khoản (vai trò mặc định)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Nguyễn Văn A }
                email: { type: string, format: email, example: a@example.com }
                password: { type: string, minLength: 6, example: matkhau123 }
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user_id: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/auth/login:
    post:
      tags: [Xác thực]
      summary: Đăng nhập, nhận token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string }
                      role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/posts:
    get:
      tags: [Bài viết]
      summary: Danh sách bài viết
      description: |
        Không đăng nhập: chỉ thấy bài `published`.
        `author`: bài của mình và các bài `published`.
        `editor` / `admin`: tất cả bài viết.
        Bài `scheduled` (hẹn giờ) chỉ hiện với người có quyền quản lý, và tự chuyển sang `published` khi đến giờ.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách bài viết
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Post' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bài viết]
      summary: Tạo bài viết
      description: |
        `author` chỉ được đặt trạng thái `draft` hoặc `review`.
        `editor` / `admin` được đặt thêm `published` hoặc `scheduled` (hẹn giờ, bắt buộc có `scheduled_at` ở tương lai).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: Đã tạo bài viết
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Bài viết]
      summary: Xem một bài viết
      description: Bài chưa `published` chỉ người quản lý được bài mới xem được, người khác nhận 404.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Chi tiết bài viết
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Bài viết]
      summary: Cập nhật bài viết
      description: Mỗi lần cập nhật, hệ thống lưu lại phiên bản trước đó (xem nhóm Phiên bản).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Bài viết]
      summary: Xóa bài viết
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/posts/{id}/moderate:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Bài viết]
      summary: Duyệt hoặc từ chối bài đang chờ duyệt
      description: Chỉ áp dụng cho bài có trạng thái `review`. Từ chối bắt buộc có `rejection_reason`. Vai trò `editor` hoặc `admin`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published, rejected] }
                rejection_reason: { type: string }
      responses:
        '200':
          description: Đã kiểm duyệt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/posts-revisions/{postId}:
    get:
      tags: [Phiên bản]
      summary: Lịch sử phiên bản của một bài viết
      description: Chỉ người quản lý được bài xem được. Sắp xếp mới nhất trước.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Danh sách phiên bản
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Revision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/revisions/{id}/restore:
    post:
      tags: [Phiên bản]
      summary: Khôi phục bài viết về một phiên bản
      description: Trạng thái hiện tại của bài được giữ nguyên; trước khi khôi phục hệ thống lưu thêm một phiên bản mới.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Đã khôi phục
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/revisions/compare:
    get:
      tags: [Phiên bản]
      summary: So sánh hai phiên bản của một bài viết
      description: |
        Trả về các trường thay đổi và diff theo từng dòng của nội dung.
        `from` là phiên bản gốc (cũ hơn), `to` là phiên bản so sánh. Dùng `to=current` hoặc bỏ trống để so với bản hiện tại.
        Hai phiên bản phải cùng một bài viết.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer }
          description: ID phiên bản gốc
        - name: to
          in: query
          required: false
          schema:
            oneOf:
              - type: integer
              - type: string
                enum: [current]
          description: ID phiên bản so sánh, hoặc `current`
      responses:
        '200':
          description: Kết quả so sánh
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RevisionComparison' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/categories:
    get:
      tags: [Danh mục]
      summary: Danh sách danh mục
      responses:
        '200':
          description: Danh sách danh mục
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Danh mục]
      summary: Tạo danh mục (editor / admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Danh mục]
      summary: Sửa danh mục (editor / admin)
      description: Danh mục cha không được là chính nó hoặc một danh mục con của nó (tránh vòng lặp).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Danh mục]
      summary: Xóa danh mục (editor / admin)
      description: Trả 409 nếu danh mục còn bài viết hoặc còn danh mục con.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/tags:
    get:
      tags: [Thẻ]
      summary: Danh sách thẻ
      responses:
        '200':
          description: Danh sách thẻ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
    post:
      tags: [Thẻ]
      summary: Tạo thẻ (editor / admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/tags/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Thẻ]
      summary: Sửa thẻ (editor / admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Thẻ]
      summary: Xóa thẻ (editor / admin)
      description: Thẻ bị gỡ khỏi các bài viết đang dùng nó.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/menus:
    get:
      tags: [Menu]
      summary: Danh sách menu kèm các mục
      responses:
        '200':
          description: Danh sách menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Menu' }
    post:
      tags: [Menu]
      summary: Tạo menu (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Menu' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/menus/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Menu]
      summary: Sửa menu (admin)
      description: Danh sách `menu_items` gửi lên sẽ thay thế toàn bộ các mục hiện có của menu.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Menu' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Menu]
      summary: Xóa menu (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/upload:
    post:
      tags: [Thư viện ảnh]
      summary: Tải ảnh lên
      description: Nhận JPG, PNG, WebP, GIF, tối đa 5 MB. Nội dung file được kiểm tra thật, không chỉ dựa vào đuôi file.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Tải lên thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  url: { type: string, example: 'http://localhost:8081/uploads/1730000000000000000.png' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Ảnh lớn hơn 5 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: File không phải ảnh hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/media:
    get:
      tags: [Thư viện ảnh]
      summary: Danh sách ảnh trong thư viện
      description: Ảnh mới nhất trước. Mọi tài khoản đã đăng nhập đều xem được.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách ảnh
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MediaItem' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/media/{name}:
    delete:
      tags: [Thư viện ảnh]
      summary: Xóa ảnh khỏi thư viện (editor / admin)
      description: Các bài viết đang dùng ảnh này sẽ không còn hiển thị được ảnh.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, example: 1730000000000000000.png }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/audit-logs:
    get:
      tags: [Quản trị]
      summary: Nhật ký hệ thống (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách nhật ký
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/users:
    get:
      tags: [Quản trị]
      summary: Danh sách người dùng (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/users/{id}/role:
    put:
      tags: [Quản trị]
      summary: Đổi vai trò người dùng (admin)
      description: Không được tự đổi vai trò của chính mình, và không được đổi vai trò của quản trị viên gốc.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Message:
      description: Thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Thiếu token, token sai hoặc hết hạn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Không đủ quyền thực hiện
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Xung đột dữ liệu (trùng slug, email, hoặc đang được sử dụng)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Không tìm thấy bài viết }

    Role:
      type: string
      enum: [admin, editor, author]

    PostStatus:
      type: string
      enum: [draft, review, rejected, published, scheduled]

    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
        total_pages: { type: integer }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        parent_id: { type: integer, nullable: true }

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        parent_id: { type: integer, nullable: true }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TagInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }

    MenuItem:
      type: object
      properties:
        id: { type: integer }
        menu_id: { type: integer }
        title: { type: string }
        type: { type: string }
        target_id: { type: integer }
        url: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Menu:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        location: { type: string }
        menu_items:
          type: array
          items: { $ref: '#/components/schemas/MenuItem' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MenuInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        location: { type: string }
        menu_items:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              type: { type: string }
              target_id: { type: integer }
              url: { type: string }
              sort_order: { type: integer }

    Post:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        excerpt: { type: string }
        status: { $ref: '#/components/schemas/PostStatus' }
        rejection_reason: { type: string }
        author_id: { type: integer }
        author: { $ref: '#/components/schemas/User' }
        moderator_id: { type: integer, nullable: true }
        moderator: { $ref: '#/components/schemas/User' }
        category_id: { type: integer }
        category: { $ref: '#/components/schemas/Category' }
        seo_title: { type: string }
        seo_description: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Giờ hẹn đăng, chỉ có khi `status` là `scheduled`
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    PostInput:
      type: object
      required: [title, slug, category_id]
      properties:
        title: { type: string }
        slug: { type: string, description: Phải duy nhất giữa các bài chưa xóa }
        content: { type: string }
        status:
          $ref: '#/components/schemas/PostStatus'
        category_id: { type: integer }
        tag_ids:
          type: array
          items: { type: integer }
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Bắt buộc và phải ở tương lai khi `status` là `scheduled`; bị bỏ qua với trạng thái khác

    Revision:
      type: object
      properties:
        id: { type: integer }
        post_id: { type: integer }
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        status: { $ref: '#/components/schemas/PostStatus' }
        category_id: { type: integer }
        user_id: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }

    ComparedVersion:
      type: object
      description: '`id` bằng 0 nghĩa là bản hiện tại của bài viết'
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/PostStatus' }
        category_id: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }

    RevisionComparison:
      type: object
      properties:
        from: { $ref: '#/components/schemas/ComparedVersion' }
        to: { $ref: '#/components/schemas/ComparedVersion' }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string, enum: [title, slug, status, category_id] }
              from: { type: string }
              to: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [equal, add, remove] }
              text: { type: string }
        added: { type: integer, description: Số dòng được thêm }
        removed: { type: integer, description: Số dòng bị xóa }

    MediaItem:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        size: { type: integer, format: int64, description: Dung lượng (byte) }
        uploaded_at: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        action: { type: string, example: CREATE_POST }
        target: { type: string, example: 'Bài viết ID: 5' }
        details: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }